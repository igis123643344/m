<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>maimaiレート計算</title>
<meta name="description" content="maimai でらっくす のレートを計算・記録する個人用アプリ">
<meta name="theme-color" content="#f6f4fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16131f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand">maimaiレート計算</div>
  <div id="hdrCenter" class="hdr-center"></div>
  <div id="hdrRating" class="hdr-rating"></div>
</header>
<div id="banner"></div>
<main id="view" class="view"></main>
</div>
<nav class="tabs" id="tabs">
  <button data-tab="best" class="on">
    <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>ベ枠</span>
  </button>
  <button data-tab="songs">
    <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span>楽曲リスト</span>
  </button>
  <button data-tab="add" class="rec">
    <span class="rec-ic"><svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="4"/></svg></span><span>記録する</span>
  </button>
  <button data-tab="history">
    <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>履歴</span>
  </button>
  <button data-tab="settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>設定</span>
  </button>
</nav>
<div id="sheetWrap" class="sheet-wrap" hidden>
  <div class="sheet-bg" data-action="closeSheet"></div>
  <div class="sheet" id="sheet"></div>
</div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="fileCamera" accept="image/*" capture="environment" hidden>
<input type="file" id="fileGallery" accept="image/*" multiple hidden>
<input type="file" id="fileImport" accept="application/json,.json" hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
